# slag room relay (Cloudflare Workers Free plan). Deploy with:
#   cd relay && npx wrangler@4 deploy
# then set NEXT_PUBLIC_SLAG_RELAY_URL=wss://slag-relay.<your-subdomain>.workers.dev in Vercel.
name = "slag-relay"
main = "worker.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SlagRoom"

# Free plan requires SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SlagRoom"]

[vars]
# Comma-separated page origins allowed to connect (empty = any). Example:
# ALLOWED_ORIGINS = "https://slag.vercel.app,http://localhost:3000"
ALLOWED_ORIGINS = ""
