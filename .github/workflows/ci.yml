name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's run, but never main's: main lands every few minutes and CI takes
# longer than that, so cancelling there left main with no finished run to say whether it was green. A queued
# main run still gives way to the next one, so main tests at most one run behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      # Each check runs even if an earlier one failed, so one run reports every problem.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Lint (warnings fail too)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm oxlint --deny-warnings --format=github

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Unused code (knip)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm knip

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      # Distribution and balance over many seeds. `pnpm check` leaves these out, so this is what runs them on every push.
      - name: Test stats
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:stats

      - uses: actions/cache@v6
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'app/**', 'public/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

  store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SRH_TOKEN: slag_local_token
      SRH_URL: http://127.0.0.1:8079
    # Same images as compose.store.yml. Keep them in step.
    services:
      redis:
        image: redis:6.2.21-alpine
      srh:
        image: hiett/serverless-redis-http:0.0.10
        env:
          SRH_MODE: env
          SRH_TOKEN: slag_local_token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Store and handlers against SRH
        run: pnpm test:store
