# The production store path, locally: real Redis behind Serverless Redis HTTP (SRH), which speaks
# Upstash's REST API. `pnpm test:store` starts this for you. Plain `pnpm dev` doesn't need it.
#
# Pinned on purpose. SRH 0.0.10 (May 2024) is the newest release; Redis 6.2 is the version Upstash
# states compatibility with. The token is a local placeholder, not a secret.
services:
  redis:
    image: redis:6.2.21-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 2s
      retries: 20

  srh:
    image: hiett/serverless-redis-http:0.0.10
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      SRH_TOKEN: slag_local_token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - '127.0.0.1:8079:80'
